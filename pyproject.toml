[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puf-attacks"
version = "0.1.0"
description = "Reproducible modeling attacks and query-budget experiments on simulated PUFs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
puf-attacks = "puf_attacks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
