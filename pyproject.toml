[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puf-lab"
version = "1.0.0"
description = "Reproducible session-drift and reliability study for Arbiter PUFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.7,<1.8",
]

[project.optional-dependencies]
report = ["python-docx>=1.1,<2", "python-pptx>=1.0,<2"]

[project.scripts]
puf-lab = "puf_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
